<div class="tvh" id="tvh">
  <div class="off" id="off"></div>
  <div class="top">
    <div class="seg"><button class="btn" id="tU"></button><button class="btn" id="tF"></button><button class="btn" id="tX"></button></div>
    <input class="search" id="q" type="text">
  </div>
  <div class="list" id="list"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
var S = {t: {}, lists: {upcoming: [], finished: [], failed: []}, tab: 'upcoming', q: '', asking: null, init: false};

function visible() {
  var q = S.q.toLowerCase();
  return (S.lists[S.tab] || []).filter(function (r) { return !q || (r.t + ' ' + r.ch).toLowerCase().indexOf(q) !== -1; });
}

function actionLabel(a) { return a === 'stop' ? S.t.stop : a === 'cancel' ? S.t.cancel : S.t.remove; }
function confirmText(a) { return a === 'remove' ? S.t.confirmRemove : S.t.confirmCancel; }

function render() {
  var list = document.getElementById('list');
  list.innerHTML = '';
  [['tU', 'upcoming'], ['tF', 'finished'], ['tX', 'failed']].forEach(function (p) {
    var b = document.getElementById(p[0]);
    b.textContent = S.t[p[1]] + ' (' + S.lists[p[1]].length + ')';
    b.classList.toggle('sel', S.tab === p[1]);
  });
  var rows = visible();
  if (!rows.length) { list.appendChild(el('div', 'empty', S.t.empty)); return; }
  rows.forEach(function (r) {
    var item = el('div', 'item');
    item.appendChild(el('div', 'dot ' + (r.r ? 'bad' : S.tab === 'failed' ? 'warn' : S.tab === 'finished' ? 'ok' : '')));
    var info = el('div', 'info');
    info.appendChild(el('div', 'nm', r.t));
    var sub = [r.ch, fmtDate(r.s) + ' - ' + fmtTime(r.e)];
    if (r.sz) { sub.push(fmtSize(r.sz)); }
    if (S.tab === 'failed' && r.st) { sub.push(r.st); }
    info.appendChild(el('div', 'sub', sub.filter(Boolean).join(' | ')));
    item.appendChild(info);
    if (r.r) { item.appendChild(el('div', 'side', S.t.running)); }
    var key = r.u + S.tab;
    if (S.asking && S.asking.key === key) {
      var ask = el('div', 'ask'); ask.appendChild(el('span', '', confirmText(S.asking.a)));
      var yes = el('button', 'btn bad', S.t.yes); yes.onclick = function () {
        var a = S.asking.a; S.asking = null;
        S.lists[S.tab] = S.lists[S.tab].filter(function (x) { return x.u !== r.u; }); render();
        requestAction(a === 'stop' ? 'Stop' : a === 'cancel' ? 'Cancel' : 'Remove', JSON.stringify({uuid: r.u}));
      };
      var no = el('button', 'btn', S.t.no); no.onclick = function () { S.asking = null; render(); };
      ask.appendChild(yes); ask.appendChild(no); item.appendChild(ask);
    } else {
      var box = el('div', 'seg');
      r.a.forEach(function (a) {
        if (a === 'remove') {
          var del = el('button', 'del'); del.innerHTML = TRASH; del.title = actionLabel(a);
          del.onclick = function () { S.asking = {key: key, a: a}; render(); };
          box.appendChild(del);
        } else {
          var b = el('button', 'btn' + (a === 'stop' ? ' bad' : ''), actionLabel(a));
          b.onclick = function () { S.asking = {key: key, a: a}; render(); };
          box.appendChild(b);
        }
      });
      item.appendChild(box);
    }
    list.appendChild(item);
  });
}

function handleMessage(json) {
  var d = typeof json === 'string' ? JSON.parse(json) : json;
  if (d.type === 'recordings') {
    S.t = d.t; S.lists = d.lists;
    document.getElementById('q').placeholder = S.t.search;
    setOnline(d.online, S.t.offline);
    if (!S.init) { S.init = true; var tab = load('dvr_tab'); if (tab === 'upcoming' || tab === 'finished' || tab === 'failed') { S.tab = tab; } }
    render();
  } else if (d.type === 'result') {
    toast(d.text, !d.ok);
  }
}

[['tU', 'upcoming'], ['tF', 'finished'], ['tX', 'failed']].forEach(function (p) {
  document.getElementById(p[0]).onclick = function () { S.tab = p[1]; S.asking = null; save('dvr_tab', S.tab); render(); };
});
document.getElementById('q').oninput = function () { S.q = this.value; render(); };
tvhFit('tvh');
</script>
